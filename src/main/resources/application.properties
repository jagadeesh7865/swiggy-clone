spring.application.name=swiggy-backend
spring.datasource.url=jdbc:mysql://localhost:3306/swiggy_clone
spring.datasource.username=root
spring.datasource.password=Password@123
#${DB_PASSWORD:Password@123}
#
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#
server.port=8080
## Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.packages-to-scan=com.swiggy.swiggy_backend.controller

springdoc.paths-to-match=/api/**

jwt.secret=${JWT_SECRET:SwiggyCloneSecretKeyForJWTAuthentication12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.debug=true

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.data.redis.host=localhost
spring.data.redis.port=6379
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG

logging.level.org.springframework.cache.interceptor=TRACE
logging.level.org.springframework.data.redis=TRACE
logging.level.org.springframework.data.redis.serializer=TRACE
logging.level.org.springframework.data.redis.cache=TRACE

